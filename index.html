<!DOCTYPE html>
<html lang="en" data-theme-default="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RepCount | Gym Payment Manager</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=20261010-01" />
    <link rel="shortcut icon" href="/favicon.svg?v=20261010-01" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=20261010-01" />
    <meta name="theme-color" content="#101C36" />
    <script>
      // Apply the theme before first paint so the loader and the app share one background.
      // data-theme-default mirrors APP_CONFIG.defaultTheme (the platform keeps it in sync).
      (function () {
        var d = document.documentElement, stored = null;
        try { stored = localStorage.getItem('app-theme'); } catch (e) {}
        var mode = stored || d.getAttribute('data-theme-default') || 'system';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        d.classList.toggle('dark', dark);
      })();
    </script>
    <style>
      #app-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--background, #fff); color: var(--muted-foreground, #666); font: 14px/1.4 var(--font-sans, system-ui, sans-serif); }
      #app-loading .ring { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--border, #e5e5e5); border-top-color: var(--primary, #333); animation: app-spin .8s linear infinite; }
      @keyframes app-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="app-loading"><div class="ring"></div><span id="app-loading-name"></span></div></div>
    <script>document.getElementById('app-loading-name').textContent = document.title;</script>
    <script>
      // Keep the pre-React loader useful if a runtime/configuration error prevents React from mounting.
      (function () {
        function getLoader() { return document.getElementById('app-loading'); }
        function note(text) {
          var el = getLoader();
          if (!el) return;
          var p = el.querySelector('.note');
          if (!p) {
            p = document.createElement('span');
            p.className = 'note';
            p.style.cssText = 'font-size:12px;opacity:.8;max-width:24rem;text-align:center;overflow-wrap:anywhere';
            el.appendChild(p);
          }
          p.textContent = text;
        }
        function showStartupFailure(reason) {
          var el = getLoader();
          if (!el) return;
          note(reason || 'The application could not finish starting.');
          var hint = el.querySelector('.startup-help');
          if (!hint) {
            hint = document.createElement('p');
            hint.className = 'startup-help';
            hint.style.cssText = 'font-size:12px;line-height:1.5;max-width:27rem;text-align:center;color:#777';
            hint.textContent = 'Check Vercel → Settings → Environment Variables for VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY, then redeploy. If both are set, open the browser console and inspect the first red error.';
            el.appendChild(hint);
          }
          var button = el.querySelector('.startup-retry');
          if (!button) {
            button = document.createElement('button');
            button.className = 'startup-retry';
            button.type = 'button';
            button.textContent = 'Reload application';
            button.style.cssText = 'margin-top:4px;padding:9px 14px;border:1px solid #888;border-radius:6px;background:transparent;color:inherit;font:inherit;cursor:pointer';
            button.addEventListener('click', function () { window.location.reload(); });
            el.appendChild(button);
          }
        }
        window.addEventListener('error', function (event) {
          if (event.target && event.target !== window) {
            showStartupFailure('A required application script or asset failed to load.');
            return;
          }
          if (event.message) showStartupFailure('Application startup error: ' + event.message);
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason && event.reason.message ? event.reason.message : '';
          showStartupFailure(reason ? 'Application startup request failed: ' + reason : 'An application startup request failed.');
        });
        setTimeout(function () { note('Starting up… the first open can take a few seconds.'); }, 3000);
        setTimeout(function () {
          if (getLoader()) showStartupFailure('RepCount did not finish starting. The browser console can identify the exact runtime error.');
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
